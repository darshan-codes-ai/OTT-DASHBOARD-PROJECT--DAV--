name: Deploy DAV Laboratory Website to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build and stage static website artifact
        run: |
          # 1. Create clean static staging directory
          mkdir -p _site

          # 2. Copy complete DAV-LAB-WEBSITE contents so index.html is at artifact root
          cp -r DAV-LAB-WEBSITE/* _site/

          # 3. Stage verified academic source files for resources.html downloads
          mkdir -p _site/source-files
          cp "DAV_Lab_Assignment_1_Movie_Streaming_Analysis.ipynb" _site/source-files/
          cp "DAV_Lab_Assignment_2_Movie_Streaming_Platform.xlsx" _site/source-files/
          cp "DAV_Lab_Assignment_3_Movie_Streaming_Analysis.ipynb" _site/source-files/
          cp "MoviesOnStreamingPlatforms.csv" _site/source-files/

          # 4. Ensure .nojekyll exists so files starting with _ or special extensions are not ignored
          touch _site/.nojekyll

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

